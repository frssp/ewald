name: Release

# sdist plus Linux wheels; on a v* tag also the GitHub Release with the CHANGELOG section.
# windows-release.yml and macos-release.yml build the Windows and macOS wheels and apps and attach
# them to the same release. See docs/developer/release.md.
# Manual only (Actions minutes); dispatch it on a v* tag to publish a release.
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check version, tag and changelog
        run: python packaging/release_check.py --check-only
      - name: Build sdist
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 30 || 3 }}

  wheels:
    name: wheels (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ENVIRONMENT: EWALD_REQUIRE_NATIVE=1
          CIBW_TEST_COMMAND: python -c "import ewald, ewald._native; print(ewald.__version__)"
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist/*.whl
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 30 || 3 }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: python packaging/release_check.py --notes > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
