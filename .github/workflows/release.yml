name: Release

# sdist plus Linux and macOS wheels; on a v* tag also the GitHub Release with the CHANGELOG section.
# Windows wheels and the Windows app come from windows-release.yml, which attaches its files to the
# same release. See docs/developer/release.md.
# Manual only (Actions minutes); dispatch it on a v* tag to publish a release.
on:
  workflow_dispatch:
    inputs:
      macos:
        description: "Build macOS wheels (macOS minutes bill 10x)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check version, tag and changelog
        run: python packaging/release_check.py --check-only
      - name: Build sdist
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 30 || 3 }}

  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is arm64; macos-13 is the last Intel runner
        os: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.macos) && '["ubuntu-latest", "macos-14", "macos-13"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ENVIRONMENT: EWALD_REQUIRE_NATIVE=1
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CIBW_TEST_COMMAND: python -c "import ewald, ewald._native; print(ewald.__version__)"
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 30 || 3 }}

  # A macOS app bundle (ewald.app with ewald.icns, .dmg) goes here as another job once
  # packaging/macos exists; the release job below picks up whatever it uploads.

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: python packaging/release_check.py --notes > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
