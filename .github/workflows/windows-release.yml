name: Windows release

# Builds Windows wheels, the standalone app (PyInstaller folder + Inno Setup installer) and the
# online installer (a private Python that pip-installs ewald from the network, D79),
# smoke-tests the frozen app, and on a v* tag attaches everything to a GitHub Release.
# See docs/developer/windows-release.md and docs/developer/release.md (release.yml builds the rest).
# Manual only (Actions minutes); dispatch it on a v* tag to publish a release.
on:
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: wheels (win_amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT: EWALD_REQUIRE_NATIVE=1
          # vendor msvcp140.dll (pybind11/C++ runtime) into the wheel
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python -c "import ewald, ewald._native; print(ewald.__version__)"
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 30 || 3 }}

  app:
    # one standalone app: GPU compute is installed from the app itself (D80), not a separate build
    name: app
    runs-on: windows-latest
    env:
      EWALD_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Mesa software OpenGL so the frozen VTK can render on the GPU-less runner
      - uses: pyvista/setup-headless-display-action@v3
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui]" pyinstaller setuptools
      - name: Version
        id: version
        shell: bash
        run: |
          v=$(python -c "import ewald; print(ewald.__version__)")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "tag ${GITHUB_REF#refs/tags/} does not match ewald.__version__ $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/windows/ewald.spec
      - name: Smoke test (CLI, analysis, rendering, GUI offscreen)
        shell: bash
        run: |
          ./dist/ewald/ewald.exe info tests/data/vasp/XDATCAR
          # exit status ignored: the process crashes on exit in the runner's Mesa (smoke.py says why)
          ./dist/ewald/ewald.exe run packaging/windows/smoke.py tests/data smoke_out > smoke.log 2>&1 \
            || echo "exit status $? (ignored)"
          cat smoke.log
          grep -q "SMOKE OK" smoke.log
      - name: Smoke test (plugins with the bundled pip)
        shell: bash
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP/ewald-local"
          ./dist/ewald/ewald.exe -m pip --version
          ./dist/ewald/ewald.exe run packaging/windows/smoke_pip.py | tee smoke_pip.log
          grep -q "PIP SMOKE OK" smoke_pip.log
      - name: Smoke test (GPU compute installed from the app)
        shell: bash
        run: |
          # what Preferences › Compute › Optional components › Install runs: CuPy and the CUDA 12
          # wheels into the add-on folder (outside dist/, so the installer stays the same size)
          export LOCALAPPDATA="$RUNNER_TEMP/ewald-local-gpu"
          # exit status ignored: the GPU summary after pip probes OpenGL, and Mesa crashes on exit;
          # smoke_gpu.py fails when pip did not install CuPy
          ./dist/ewald/ewald.exe gpu --install || echo "exit status $? (ignored)"
          ./dist/ewald/ewald.exe run packaging/windows/smoke_gpu.py | tee smoke_gpu.log
          grep -q "GPU SMOKE OK" smoke_gpu.log
          du -sh "$LOCALAPPDATA/ewald/python"
      - name: Smoke test (windowed GUI)
        shell: pwsh
        run: |
          $env:EWALD_SMOKE_TEST = "1"
          $p = Start-Process -FilePath dist\ewald\ewald-gui.exe -ArgumentList "tests\data\vasp\XDATCAR" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "ewald-gui.exe exited with $($p.ExitCode)" }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} packaging\windows\ewald.iss
      - name: Portable zip
        shell: pwsh
        run: |
          $name = "ewald-${{ steps.version.outputs.version }}-win64-portable.zip"
          7z a -tzip -mx=7 "dist\$name" .\dist\ewald\* | Out-Null
          Get-ChildItem dist\*.exe, dist\*.zip | Format-Table Name, @{n="MB"; e={[math]::Round($_.Length / 1MB)}}
      - name: Size (last, so it ends the log)
        shell: bash
        run: |
          du -sh dist/ewald && du -sh dist/ewald/_internal/* | sort -rh | head -30 | tee size.txt
          echo "files over 5 MB:" | tee -a size.txt
          find dist/ewald -type f -size +5M -exec du -h {} + | sort -rh | head -40 | tee -a size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          compression-level: 0
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 30 || 3 }}

  online:
    # the online installer (D79): a private Python 3.12 from python.org's NuGet package; setup pip
    # installs ewald (this release's cp312 wheel) and its dependencies from the network
    name: online installer
    needs: wheels
    runs-on: windows-latest
    env:
      PYTHON_NUGET: "3.12.10"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels
      - name: Version
        id: version
        shell: bash
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/ewald/__init__.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Python for the installer (python.org NuGet package)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/python/$env:PYTHON_NUGET" -OutFile python.zip
          Expand-Archive python.zip -DestinationPath nuget-python
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item nuget-python\tools dist\online-python
          dist\online-python\python.exe -c "import sys, venv, ensurepip; print(sys.version)"
          "{0:N0} MB" -f ((Get-ChildItem dist\online-python -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} packaging\windows\ewald-online.iss
          Get-ChildItem dist\*-online-setup.exe | Format-Table Name, @{n="MB"; e={[math]::Round($_.Length / 1MB)}}
      - uses: pyvista/setup-headless-display-action@v3
      - name: Smoke test (silent install from the network with this run's wheel, then the frozen-app smoke script)
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem wheels\ewald-*-cp312-cp312-win_amd64.whl).FullName
          $dir = "$env:RUNNER_TEMP\ewald-online"
          $setup = (Get-ChildItem dist\*-online-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=$dir", "/SOURCE=$wheel", "/LOG=$env:RUNNER_TEMP\setup.log" -PassThru -Wait
          Get-Content "$dir\install.log" -Tail 30
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "setup exited with $($p.ExitCode)" }
          & "$dir\python\python.exe" -c "import ewald, pymatgen, PySide6, vtk; print('ewald', ewald.__version__, 'pymatgen ok')"
          & "$dir\python\python.exe" packaging\windows\smoke.py tests\data smoke_out *> smoke.log
          Get-Content smoke.log
          if (-not (Select-String -Path smoke.log -Pattern "SMOKE OK" -Quiet)) { throw "smoke test failed" }
          exit 0   # python's exit status is ignored: it crashes on exit in the runner's Mesa (smoke.py says why)
      - uses: actions/upload-artifact@v4
        with:
          name: app-online
          path: dist/*-online-setup.exe
          compression-level: 0
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 30 || 3 }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, app, online]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # same notes as release.yml, so whichever workflow finishes first creates the same release
      - name: Release notes from CHANGELOG.md
        run: python packaging/release_check.py --notes > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
