name: Windows release

# Builds Windows wheels and the standalone app (PyInstaller folder + Inno Setup installer),
# smoke-tests the frozen app, and on a v* tag attaches everything to a GitHub Release.
# See docs/windows-release.md.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/windows/**"
      - ".github/workflows/windows-release.yml"
      - "setup.py"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: wheels (win_amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_ARCHS_WINDOWS: AMD64
          # vendor msvcp140.dll (pybind11/C++ runtime) into the wheel
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python -c "import ewald, ewald._native; print(ewald.__version__)"
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  app:
    name: app (${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, gpu]
    env:
      EWALD_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Mesa software OpenGL so the frozen VTK can render on the GPU-less runner
      - uses: pyvista/setup-headless-display-action@v3
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui]" pyinstaller
          if [ "$EWALD_VARIANT" = gpu ]; then
            # CuPy plus the CUDA 12 runtime libraries it loads (the user only needs an NVIDIA driver)
            python -m pip install cupy-cuda12x nvidia-cuda-runtime-cu12 nvidia-cuda-nvrtc-cu12 \
              nvidia-cufft-cu12 nvidia-cublas-cu12 nvidia-curand-cu12 nvidia-cusolver-cu12 nvidia-cusparse-cu12
          fi
      - name: Version
        id: version
        shell: bash
        run: |
          v=$(python -c "import ewald; print(ewald.__version__)")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "tag ${GITHUB_REF#refs/tags/} does not match ewald.__version__ $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/windows/ewald.spec
      - name: Smoke test (CLI, analysis, rendering, GUI offscreen)
        shell: bash
        run: |
          ./dist/ewald/ewald.exe info tests/data/vasp/XDATCAR
          ./dist/ewald/ewald.exe run packaging/windows/smoke.py tests/data smoke_out | tee smoke.log
          grep -q "SMOKE OK" smoke.log
      - name: Smoke test (windowed GUI)
        shell: pwsh
        run: |
          $env:EWALD_SMOKE_TEST = "1"
          $p = Start-Process -FilePath dist\ewald\ewald-gui.exe -ArgumentList "tests\data\vasp\XDATCAR" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "ewald-gui.exe exited with $($p.ExitCode)" }
      - name: Size
        shell: bash
        run: du -sh dist/ewald && du -sh dist/ewald/_internal/* | sort -rh | head -15
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} /DVariant=${{ matrix.variant }} packaging\windows\ewald.iss
      - name: Portable zip
        shell: pwsh
        run: |
          $name = "ewald-${{ steps.version.outputs.version }}-win64-${{ matrix.variant }}-portable.zip"
          7z a -tzip -mx=7 "dist\$name" .\dist\ewald\* | Out-Null
          Get-ChildItem dist\*.exe, dist\*.zip | Format-Table Name, @{n="MB"; e={[math]::Round($_.Length / 1MB)}}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.variant }}
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
