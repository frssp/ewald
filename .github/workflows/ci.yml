name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Xvfb on Linux, Mesa's software OpenGL on Windows (the runner has none), no-op on macOS
      - name: Set up headless OpenGL for VTK
        uses: pyvista/setup-headless-display-action@v3
      - name: Install package
        run: python -m pip install -e ".[dev]"
      # GUI tests (PySide6 widgets + main window under Xvfb) on Linux only
      - name: Install GUI extras (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libegl1
          python -m pip install -e ".[gui]"
      - name: Run tests
        run: python -m pytest -ra
