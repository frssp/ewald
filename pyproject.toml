[build-system]
requires = ["setuptools>=68", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "ewald"
dynamic = ["version"]   # ewald.__version__ in src/ewald/__init__.py, the one place to bump
description = "EWALD (Extensible Workbench for Atomic Lattices & Dynamics): atomistic structure and trajectory visualization and analysis with a Python pipeline API"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
# numpy 2: the default integer is int64 on Windows too (numpy 1 used int32 there)
dependencies = ["numpy>=2.0", "scipy", "ase>=3.23", "matplotlib", "pillow", "pyvista>=0.44", "vtk>=9.3", "numba>=0.60",
                "tomli>=1.1; python_version < '3.11'",   # tomli: plugin manifests on Python 3.10
                "paramiko>=3.2", "keyring>=24",   # files on SSH hosts and saved remote computers; secrets in the OS keychain
                "truststore>=0.9",   # downloads trust the OS certificate store (company proxies that re-sign HTTPS)
                # small wheels that used to be extras: one install has every feature that needs no GPU, Qt or OVITO
                "spglib>=2.0",   # SymmetryAnalysis (space group, Wyckoff positions)
                "imageio-ffmpeg",   # bundled ffmpeg binary for MP4/AVI/MOV
                "h5py",   # H5MD, vaspout.h5, MDTraj HDF5
                "anthropic>=1.0", "openai>=1.40", "mcp",   # Ask AI (Claude, OpenAI-compatible providers), MCP server
                "ipython>=8.12", "traitlets",   # notebook cells run in IPython shells (ewald.shell): magics, display(), rich outputs
                "tqdm",   # progress bars (ewald.progress): downloads and long loops, drawn live under the cell
                "jupyter_client>=7", "ipykernel"]   # notebooks whose cells run in another Python (ewald.kernel)

[project.optional-dependencies]
# Only what is heavy, platform-specific or pins other packages stays optional.
gui = ["PySide6>=6.5", "pyvistaqt>=0.11", "qtconsole>=5.5", "pygments"]   # PySide6 only: no PyQt5/PyQt6 (see ewald/gui/__init__.py)
gpu = ["cupy-cuda12x; sys_platform != 'darwin'"]   # no CUDA on macOS: the extra installs nothing there
opencl = ["pyopencl>=2022.1"]   # ray tracing on Intel, AMD, NVIDIA and Apple GPUs; needs the GPU's OpenCL driver
formats = ["MDAnalysis>=2.7"]   # GROMACS XTC/TRR, DCD, NetCDF
ovito = ["ovito"]   # DislocationAnalysis (DXA) and OvitoModifier bridge; pins its PySide6, so install with gui
all = ["ewald[gui,formats,ovito,opencl]"]   # everything but gpu (needs an NVIDIA GPU with CUDA 12)
dev = ["pytest", "nbformat", "jupytext"]   # nbformat/jupytext: round-trip tests of .ipynb and percent .py notebooks
# kept so old install commands work: these packages are in the core install now
kernel = []
symmetry = []
movie = []
llm = []
remote = []

[project.scripts]
ewald = "ewald.__main__:main"
ewald-gui = "ewald.gui:main"

[project.urls]
Homepage = "https://github.com/frssp/ewald"
Documentation = "https://github.com/frssp/ewald/tree/main/docs"
Changelog = "https://github.com/frssp/ewald/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "ewald.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the license notices of the ported and vendored C++ in ewald/_csrc ship with every install
ewald = ["tables/*.json", "examples/files/*", "_csrc/README.md", "_csrc/LICENSE*", "_csrc/*/LICENSE",
         "assets/icon/*.png", "assets/icon/*.svg", "assets/icon/*.ico", "assets/icon/*.icns",
         "assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/fonts/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
